# Reusable LLM profile templates for epub-reader.
#
# The running program reads the platform config (for example
# ~/.config/epub-reader/llm.toml), never this repository template.
# Run `epub-reader --setup` to append a profile interactively.
#
# Each `[[llm]]` table is one selectable template with a unique `name`.
# A new book selects a template once. Its effective non-secret settings are
# then saved at the head of that book's *_state.json for deterministic resume.

[[llm]]
name = "deepseek-pro"

# Wire format: "anthropic" (/v1/messages) or "openai" (/chat/completions).
provider = "openai"
model = "deepseek-v4-pro"
base_url = "api.deepseek.com" # `https://` is added when omitted

# Credential precedence:
# 1. A non-empty `api_key` stored directly in this platform config.
# 2. The environment variable named by `api_key_env`.
# 3. Provider default: ANTHROPIC_AUTH_TOKEN or DEEPSEEK_API_KEY.
#
# Inline keys are plaintext in the owner-only platform config. Setup input is
# visible, but keys are never copied into state JSON, translation logs, or errors.
# api_key = "..."
api_key_env = "DEEPSEEK_API_KEY"

thinking = false
# thinking_effort = "high"       # low / medium / high / xhigh / max
max_output_tokens = 32768
# request_timeout_secs = 180
jobs = 10

[[llm]]
name = "anthropic-default"
provider = "anthropic"
model = "deepseek-v4-flash"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_AUTH_TOKEN"
thinking = false
jobs = 2
