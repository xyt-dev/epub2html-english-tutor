# LLM provider configuration for epub-reader.
#
# This file holds only non-secret settings. The API key itself is never
# stored here — it is always read from an environment variable (see
# `api_key_env` below). CLI flags (--llm-provider/--llm-model/--llm-base-url/
# --llm-thinking/--llm-no-thinking/--jobs) override whatever is set in this file.

[llm]
# Wire format to speak to the provider:
# - "anthropic": Anthropic Messages API (/v1/messages). Also spoken by most
#   Anthropic-compatible relay gateways (中转站).
# - "openai": OpenAI Chat Completions API (/chat/completions). Also spoken
#   by DeepSeek's native API.
provider = "openai"

# Model name sent to the provider.
model = "deepseek-v4-pro"

# API base URL. Defaults depend on `provider` when omitted:
# - anthropic -> https://api.anthropic.com
# - openai    -> https://api.deepseek.com
base_url = "https://api.deepseek.com"

# Name of the environment variable holding the API key. Defaults depend on
# `provider` when omitted:
# - anthropic -> ANTHROPIC_AUTH_TOKEN
# - openai    -> DEEPSEEK_API_KEY
# api_key_env = "DEEPSEEK_API_KEY"

# Enable model thinking/reasoning mode. Defaults to false (thinking off).
thinking = false

# Token budget reserved for thinking when `thinking = true`. Only enforced
# for the Anthropic format (must be >= 1024 and < max_output_tokens).
# thinking_budget_tokens = 4096

# Maximum tokens the model may generate per request.
# max_output_tokens = 8192

# HTTP request timeout, in seconds.
# request_timeout_secs = 180

# Maximum concurrent translation requests. This controls how many batch API
# calls can be in flight at once. Higher values do not change the source
# context attached to each request; they only affect throughput.
jobs = 10
